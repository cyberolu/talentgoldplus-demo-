<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Manage Users | TalentGoldPlus</title>
  <link rel="icon" type="image/png" href="../assets/images/favicon.png">

  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/admin.css">
</head>

<body style="display: none;">

<div class="admin-layout">

  <aside class="admin-sidebar">
    <div class="admin-brand">
      <h2>TalentGoldPlus</h2>
      <p>Admin Panel</p>
    </div>

    <nav class="admin-menu">
      <a href="index.html">Dashboard</a>
      <a href="users.html" class="active">Users</a>
      <a href="approvals.html">Approvals</a>
      <a href="reports.html">Reports</a>
      <a href="../pages/dashboard.html">User Dashboard</a>
    </nav>

    <button id="logoutBtn" class="admin-logout" type="button">
      Logout
    </button>    
  </aside>

  <main class="admin-main">

    <header class="admin-topbar">
      <div>
        <h1>Manage Users</h1>
        <p id="adminWelcome">Checking access...</p>
      </div>
    </header>

    <section class="admin-panel">

      <h2>All Users</h2>

      <div class="admin-table-wrap">
        <table class="admin-table">
          <thead>
            <tr>
              <th scope="col">User</th>
              <th scope="col">Email</th>
              <th scope="col">Current Role</th>
              <th scope="col">Change Role</th>
              <th scope="col">Profile</th>
              <th scope="col">Status</th>
            </tr>
          </thead>

          <tbody id="usersTableBody">
            <tr>
              <td colspan="6">Loading users...</td>
            </tr>
          </tbody>
        </table>
      </div>

    </section>

  </main>

</div>

<script type="module" src="../js/admin/users.js"></script>

<script
  src="../js/admin/admin-mobile-nav.js"
></script>

<script src="../js/components-loader.js"></script>

</body>
</html>
