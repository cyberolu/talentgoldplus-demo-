<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Register | TalentGoldPlus</title>

  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/auth.css">
</head>

<body>

  <div id="siteHeader"></div>

<main>

  <section class="container auth-container">

    <div class="auth-card">

      <h1>Create Account</h1>

      <p>
        Join TalentGoldPlus and become part of the global sports ecosystem.
      </p>

      <form id="registerForm">

        <input
          type="text"
          id="name"
          placeholder="Full Name"
          required
        >

        <input
          type="email"
          id="email"
          placeholder="Email Address"
          required
        >

        <input
          type="password"
          id="password"
          name="password"
          placeholder="Password"
          autocomplete="new-password"
          minlength="8"
          required
        >

        <select id="role" required>

          <option value="">
            Select Role
          </option>

          <option value="athlete">
            Athlete
          </option>

          <option value="coach">
            Coach
          </option>

          <option value="professional">
            Professional
          </option>

          <option value="scout">
            Scout
          </option>

          <option value="investor">
            Investor
          </option>

          <option value="partner">
            Partner
          </option>

          <option value="volunteer">
            Volunteer
          </option>

        </select>

        <select id="category" required>

          <option value="">
            Select Category
          </option>

        </select>

        <button type="submit" class="btn-primary auth-btn">
          Create Account
        </button>

      </form>

      <p class="auth-link">

        Already have an account?

        <a href="login.html">
          Login
        </a>

      </p>

    </div>

  </section>

</main>

<script>

  const roleSelect =
    document.getElementById("role");

  const categorySelect =
    document.getElementById("category");

  const params =
    new URLSearchParams(window.location.search);

  const roleFromUrl =
    params.get("role");

  const categories = {

    athlete: [
      "Football",
      "Athletics",
      "Basketball",
      "Rugby",
      "Tennis",
      "Combat Sports",
      "Other"
    ],

    coach: [
      "Football Coach",
      "Athletics Coach",
      "Basketball Coach",
      "Rugby Coach",
      "Tennis Coach",
      "Strength & Conditioning Coach",
      "Other"
    ],

    professional: [
      "Physiotherapist",
      "Sports Therapist",
      "Nutritionist",
      "Psychologist",
      "Wellbeing Specialist",
      "Recovery Expert",
      "Mentor",
      "Performance Specialist"
    ],

    scout: [
      "Football Scout",
      "Athletics Scout",
      "Basketball Scout",
      "Rugby Scout",
      "Tennis Scout",
      "Multi-Sport Scout"
    ],

    investor: [
      "Athlete Sponsor",
      "Grassroots Supporter",
      "Club Investor",
      "Brand Partner",
      "Donor",
      "Other"
    ],

    partner: [
      "Sports Organisation",
      "Sports Club",
      "Corporate Partner",
      "Educational Institution",
      "Technology Partner",
      "Media Partner",
      "Community Partner",
      "Healthcare Partner",
      "Government Agency",
      "Non Profit Organisation",
      "Other"
    ],
    
    volunteer: [
      "Event Volunteer",
      "Community Volunteer",
      "Youth Mentor",
      "Sports Coach Volunteer",
      "Media Volunteer",
      "Administrative Volunteer",
      "Fundraising Volunteer",
      "Safeguarding Volunteer",
      "Medical Support Volunteer",
      "Other"
    ]
  };

 function populateCategories(selectedRole) {

    categorySelect.innerHTML =
      '<option value="">Select Category</option>';

    if (!categories[selectedRole]) {
        return;
    }

    categories[selectedRole].forEach((category) => {

        const option =
            document.createElement("option");

        option.value =
            category
                .toLowerCase()
                .replaceAll(" ", "-")
                .replaceAll("&", "and");

        option.textContent = category;

        categorySelect.appendChild(option);

    });

}

roleSelect.addEventListener("change", () => {

    populateCategories(roleSelect.value);

});

if (
    roleFromUrl &&
    categories[roleFromUrl]
) {

    roleSelect.value =
        roleFromUrl;

    populateCategories(roleFromUrl);

}

</script>
<script type="module" src="../js/auth/register.js"></script>

<script src="../js/components-loader.js"></script>

</body>
</html>
