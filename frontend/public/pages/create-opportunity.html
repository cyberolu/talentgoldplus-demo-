<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Post Opportunity | TalentGoldPlus</title>
  <link rel="icon" type="image/png" href="../assets/images/favicon.png">

  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/auth.css">
  <link rel="stylesheet" href="../css/opportunities.css">
</head>

<body>

<div id="siteHeader"></div>

<main>

  <section class="container auth-container">

    <div class="auth-card">

      <h1>Post an Opportunity</h1>

      <p>
        Share trials, scholarships, funding, courses, events, jobs or volunteering opportunities with the TalentGoldPlus community.
      </p>

      <form id="opportunityForm">

        <input
          type="text"
          id="opportunityTitle"
          placeholder="Opportunity title"
          required
        >

        <select id="opportunityCategory" required>
          <option value="">Select Category</option>
          <option value="trials">Trials</option>
          <option value="scholarships">Scholarships</option>
          <option value="funding">Funding</option>
          <option value="courses">Courses</option>
          <option value="events">Events</option>
          <option value="jobs">Jobs</option>
          <option value="volunteering">Volunteering</option>
          <option value="other">Other</option>
        </select>

        <textarea
          id="opportunityDescription"
          placeholder="Describe the opportunity"
          required
        ></textarea>

        <input
          type="text"
          id="opportunityOrganisation"
          placeholder="Organisation or provider name"
        >

        <input
          type="text"
          id="opportunityLocation"
          placeholder="Location or online"
        >

        <label for="opportunityClosingDate">
          Closing Date
        </label>

        <input
          type="date"
          id="opportunityClosingDate"
        >

        <input
          type="url"
          id="opportunityApplyLink"
          placeholder="Application link, e.g. https://example.com/apply"
        >

        <input
          type="email"
          id="opportunityContactEmail"
          placeholder="Contact email"
        >

        <button
          type="submit"
          class="btn-primary auth-btn"
        >
          Submit Opportunity
        </button>

      </form>

    </div>

  </section>

</main>

<a
  href="https://wa.me/447438065365?text=Hello%20TalentGoldPlus,%20I%20would%20like%20to%20find%20out%20more."
  class="whatsapp-button"
  target="_blank"
  rel="noopener noreferrer"
>
  Chat on WhatsApp
</a>

<div id="siteFooter"></div>

<script src="../js/components-loader.js"></script>
<script src="../js/navigation.js"></script>
<script type="module" src="../js/auth/auth-state.js"></script>
<script type="module" src="../js/opportunities.js"></script>

</body>
</html>
