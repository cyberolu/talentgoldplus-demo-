<!DOCTYPE html>
<html lang="en-GB">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Account Review | TalentGoldPlus
  </title>

  <link
    rel="icon"
    type="image/png"
    href="../assets/images/favicon.png"
  >

  <link
    rel="stylesheet"
    href="../css/styles.css"
  >

  <link
    rel="stylesheet"
    href="../css/layout.css"
  >

  <link
    rel="stylesheet"
    href="../css/components.css"
  >

</head>


<body>

  <main
    style="
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px;
      background: #f4f6f8;
    "
  >

    <section
      style="
        width: 100%;
        max-width: 620px;
        background: white;
        padding: 48px;
        border-radius: 24px;
        border: 1px solid #eee;
        box-shadow: 0 15px 40px rgba(0,0,0,0.07);
        text-align: center;
      "
    >

      <img
        src="../assets/images/TalentGoldPlus.png"
        alt="TalentGoldPlus"
        style="
          width: 110px;
          height: 110px;
          object-fit: contain;
          margin-bottom: 20px;
        "
      >

      <h1 id="reviewTitle">
        Account Under Review
      </h1>

      <p
        id="reviewMessage"
        style="
          font-size: 17px;
          line-height: 1.7;
          color: #666;
          margin: 18px 0 30px;
        "
      >
        Your TalentGoldPlus account has been created successfully.
        Our team will review your registration before full platform access is enabled.
      </p>

      <p
        style="
          color: #777;
          margin-bottom: 28px;
        "
      >
        You can return later and sign in to check your account status.
      </p>

      <button
        id="pendingLogoutBtn"
        type="button"
        class="btn-primary"
      >
        Sign Out
      </button>

    </section>

  </main>


  <script type="module">

    import {
      auth
    } from "../js/firebase.js";

    import {
      signOut
    } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";


    const params =
      new URLSearchParams(
        window.location.search
      );

    const status =
      params.get(
        "status"
      );


    if (
      status === "rejected"
    ) {

      document
        .getElementById(
          "reviewTitle"
        )
        .textContent =
          "Account Application Not Approved";

      document
        .getElementById(
          "reviewMessage"
        )
        .textContent =
          "Your TalentGoldPlus registration has not been approved. Please contact TalentGoldPlus if you need further information.";

    }


    document
      .getElementById(
        "pendingLogoutBtn"
      )
      .addEventListener(
        "click",
        async () => {

          await signOut(
            auth
          );

          window.location.href =
            "../auth/login.html";

        }
      );

  </script>

</body>

</html>
