<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Professional Profile | TalentGoldPlus</title>
  <link rel="icon" type="image/png" href="../assets/images/favicon.png">

  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
</head>

<body>

  <!-- HEADER -->
  <div id="siteHeader"></div>
  <!-- MAIN -->
  <main>

    <section class="profile-section">

      <div class="profile-container">

        <!-- LEFT -->
        <div class="profile-image">
          <img id="profileImage" src="../assets/images/pro1.jpg" alt="Professional">
        </div>

        <!-- RIGHT -->
        <div class="profile-content">

          <h1 id="profileName"></h1>

          <p class="profile-role" id="profileRole"></p>

          <p class="profile-location" id="profileLocation"></p>

          <!-- STATS -->
          <div class="profile-stats">

            <div class="stat-box">
              <h3 id="experience"></h3>
              <p>Years Experience</p>
            </div>

            <div class="stat-box">
              <h3 id="athletesSupported"></h3>
              <p>Athletes Supported</p>
            </div>

            <div class="stat-box">
              <h3 id="successRate"></h3>
              <p>Success Rate</p>
            </div>

          </div>

          <!-- BIO -->
          <div class="profile-bio">

            <h2>About</h2>

            <p id="bio"></p>

          </div>

          <!-- SPECIALTIES -->
          <div class="profile-specialties">

            <h2>Specialties</h2>

            <ul id="specialties"></ul>

          </div>

          <!-- BUTTONS -->
          <div class="profile-contact">

            <a href="#" class="btn-primary">
              Contact Professional
            </a>

            <a href="services.html" class="btn-secondary">
              Back to Professionals
            </a>

          </div>

        </div>

      </div>

    </section>

  </main>

 <a
  href="https://wa.me/447438065365?text=Hello%20TalentGoldPlus,%20I%20would%20like%20to%20find%20out%20more."
  class="whatsapp-button"
  target="_blank"
  rel="noopener noreferrer"
>
  Chat on WhatsApp
</a>

  <div id="siteFooter"></div>

  <!-- JS -->
  <script src="../js/navigation.js"></script>

  <script>

    const professionals = {

      1: {
        name: "Dr Emily Carter",
        role: "Sports Therapist",
        location: "London, United Kingdom",
        image: "../assets/images/pro1.jpg",
        experience: "8+",
        athletesSupported: "250+",
        successRate: "95%",
        bio: "Dr Emily Carter specialises in athlete recovery, injury prevention and performance rehabilitation.",
        specialties: [
          "Sports Injury Recovery",
          "Performance Recovery",
          "Mobility Training"
        ]
      },

      2: {
        name: "Michael Brown",
        role: "Performance Nutritionist",
        location: "Manchester, United Kingdom",
        image: "../assets/images/pro2.jpg",
        experience: "10+",
        athletesSupported: "300+",
        successRate: "92%",
        bio: "Michael Brown helps athletes optimise nutrition, energy and recovery for elite performance.",
        specialties: [
          "Elite Nutrition",
          "Meal Planning",
          "Performance Diets"
        ]
      },

      3: {
        name: "Sarah Williams",
        role: "Mental Health Specialist",
        location: "Birmingham, United Kingdom",
        image: "../assets/images/pro3.jpg",
        experience: "7+",
        athletesSupported: "180+",
        successRate: "97%",
        bio: "Sarah Williams focuses on athlete wellbeing, confidence and mental resilience.",
        specialties: [
          "Mental Resilience",
          "Athlete Wellbeing",
          "Performance Psychology"
        ]
      }

    };

    const params = new URLSearchParams(window.location.search);
    const id = params.get("id") || 1;

    const professional = professionals[id];

    document.getElementById("profileName").textContent = professional.name;
    document.getElementById("profileRole").textContent = professional.role;
    document.getElementById("profileLocation").textContent = professional.location;

    document.getElementById("profileImage").src = professional.image;

    document.getElementById("experience").textContent = professional.experience;
    document.getElementById("athletesSupported").textContent = professional.athletesSupported;
    document.getElementById("successRate").textContent = professional.successRate;

    document.getElementById("bio").textContent = professional.bio;

    const specialtiesList = document.getElementById("specialties");

    professional.specialties.forEach(item => {

      const li = document.createElement("li");
      li.textContent = item;

      specialtiesList.appendChild(li);

    });

  </script>

<script src="../js/components-loader.js"></script>

</body>
</html>
