<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Messages | TalentGoldPlus</title>

  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/messages.css">
</head>

<body>

<!-- HEADER -->
<div id="siteHeader"></div>

<main>

  <section class="messages-page">

    <div class="messages-layout">

      <aside class="messages-sidebar">

        <div class="messages-sidebar-header">
          <h2>Messages</h2>
          <button id="newChatBtn" class="btn-primary">
            New Chat
          </button>
        </div>
        
        <div id="newChatSearch" class="new-chat-search" style="display: none;">
          <input
            type="text"
            id="userSearchInput"
            placeholder="Search members..."
            autocomplete="off"
          >
        
          <div id="userSearchResults" class="user-search-results"></div>
        </div>
        
        <div id="conversationList" class="conversation-list">
          <p>Loading conversations...</p>
        </div>

      </aside>

      <section class="messages-main">

        <div id="chatHeader" class="chat-header">
          <h2>Select a conversation</h2>
          <p>Choose a conversation or start a new chat.</p>
        </div>

        <div id="messagesList" class="messages-list"></div>

        <form id="messageForm" class="message-form">

          <input
            type="text"
            id="messageInput"
            placeholder="Type your message..."
            autocomplete="off"
          >

          <button type="submit" class="btn-primary">
            Send
          </button>

        </form>

      </section>

    </div>

  </section>

</main>
<div id="siteFooter"></div>

<script src="../js/components-loader.js"></script>
<script src="../js/navigation.js"></script>
<script type="module" src="../js/auth.js?v=2"></script>
<script type="module" src="../js/messages.js?v=2"></script>

</body>
</html>
