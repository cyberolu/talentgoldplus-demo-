<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Scout Profile | TalentGoldPlus</title>

  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
</head>

<body>

  <!-- HEADER -->
  <div id="siteHeader"></div>
  <!-- MAIN -->
  <main>

    <section class="profile-section">

      <div class="profile-container">

        <!-- LEFT -->
        <div class="profile-image">
          <img id="profileImage" src="../assets/images/scout1.jpg" alt="Scout">
        </div>

        <!-- RIGHT -->
        <div class="profile-content">

          <h1 id="profileName"></h1>

          <p class="profile-role" id="profileRole"></p>

          <p class="profile-location" id="profileLocation"></p>

          <!-- STATS -->
          <div class="profile-stats">

            <div class="stat-box">
              <h3 id="experience"></h3>
              <p>Years Experience</p>
            </div>

            <div class="stat-box">
              <h3 id="athletesDiscovered"></h3>
              <p>Athletes Discovered</p>
            </div>

            <div class="stat-box">
              <h3 id="regions"></h3>
              <p>Regions Covered</p>
            </div>

          </div>

          <!-- BIO -->
          <div class="profile-bio">

            <h2>About</h2>

            <p id="bio"></p>

          </div>

          <!-- SPECIALTIES -->
          <div class="profile-specialties">

            <h2>Specialties</h2>

            <ul id="specialties"></ul>

          </div>

          <!-- BUTTONS -->
          <div class="profile-contact">

            <a href="#" class="btn-primary">
              Contact Scout
            </a>

            <a href="scouts.html" class="btn-secondary">
              Back to Scouts
            </a>

          </div>

        </div>

      </div>

    </section>

  </main>

  <!-- WHATSAPP -->
  <a href="https://wa.me/447XXXXXXXXX" class="whatsapp-button">
    Chat on WhatsApp
  </a>

  <div id="siteFooter"></div>

  <!-- JS -->
  <script src="../js/navigation.js"></script>

  <script>

    const scouts = {

      1: {
        name: "Daniel Moore",
        role: "Football Scout",
        location: "England & Europe",
        image: "../assets/images/scout1.jpg",
        experience: "12+",
        athletesDiscovered: "180+",
        regions: "15+",
        bio: "Daniel Moore specialises in identifying elite youth football talent across Europe and building professional pathways for young players.",
        specialties: [
          "Youth Football Recruitment",
          "Elite Pathway Identification",
          "International Scouting"
        ]
      },

      2: {
        name: "Sophia Williams",
        role: "Athletics Scout",
        location: "International Recruitment",
        image: "../assets/images/scout2.jpg",
        experience: "9+",
        athletesDiscovered: "120+",
        regions: "10+",
        bio: "Sophia Williams works with athletics programmes and international development systems to identify emerging sprint and field talent.",
        specialties: [
          "Sprint Talent Identification",
          "Scholarship Pathways",
          "Performance Evaluation"
        ]
      },

      3: {
        name: "Michael Johnson",
        role: "Basketball Scout",
        location: "US & Europe Pathways",
        image: "../assets/images/scout3.jpg",
        experience: "14+",
        athletesDiscovered: "240+",
        regions: "20+",
        bio: "Michael Johnson focuses on elite basketball recruitment and athlete progression into academy and professional systems.",
        specialties: [
          "Basketball Recruitment",
          "International Opportunities",
          "Elite Athlete Evaluation"
        ]
      }

    };

    const params = new URLSearchParams(window.location.search);
    const id = params.get("id") || 1;

    const scout = scouts[id];

    document.getElementById("profileName").textContent = scout.name;
    document.getElementById("profileRole").textContent = scout.role;
    document.getElementById("profileLocation").textContent = scout.location;

    document.getElementById("profileImage").src = scout.image;

    document.getElementById("experience").textContent = scout.experience;
    document.getElementById("athletesDiscovered").textContent = scout.athletesDiscovered;
    document.getElementById("regions").textContent = scout.regions;

    document.getElementById("bio").textContent = scout.bio;

    const specialtiesList = document.getElementById("specialties");

    scout.specialties.forEach(item => {

      const li = document.createElement("li");

      li.textContent = item;

      specialtiesList.appendChild(li);

    });

  </script>

<script src="../js/components-loader.js"></script>

</body>
</html>
