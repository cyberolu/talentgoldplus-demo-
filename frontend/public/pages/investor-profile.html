<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Investor Profile | TalentGoldPlus</title>
  <link rel="icon" type="image/png" href="../assets/images/favicon.png">

  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
</head>

<body>

  <!-- HEADER -->
  <div id="siteHeader"></div>

  <!-- MAIN -->
  <main>

    <section class="profile-section">

      <div class="profile-container">

        <!-- LEFT -->
        <div class="profile-image">
          <img id="profileImage" src="../assets/images/investor1.jpg" alt="Investor">
        </div>

        <!-- RIGHT -->
        <div class="profile-content">

          <h1 id="profileName">Loading...</h1>

          <p class="profile-role" id="profileRole"></p>

          <p class="profile-location" id="profileLocation"></p>

          <!-- STATS -->
          <div class="profile-stats">

            <div class="stat-box">
              <h2 id="investments">0</h2>
              <p>Investments</p>
            </div>

            <div class="stat-box">
              <h2 id="athletesSupported">0</h2>
              <p>Athletes Supported</p>
            </div>

            <div class="stat-box">
              <h2 id="regions">0</h2>
              <p>Regions Covered</p>
            </div>

          </div>

          <!-- BIO -->
          <div class="profile-bio">

            <h2>About</h2>

            <p id="bio"></p>

          </div>

          <!-- SPECIALTIES -->
          <div class="profile-specialties">

            <h2>Investment Focus</h2>

            <ul id="specialties"></ul>

          </div>

          <!-- BUTTONS -->
          <div class="profile-contact">

            <a href="#" class="btn-primary">
              Contact Investor
            </a>

            <a href="investors.html" class="btn-secondary">
              Back to Investors
            </a>

          </div>

        </div>

      </div>

    </section>

  </main>

 <a
  href="https://wa.me/447438065365?text=Hello%20TalentGoldPlus,%20I%20would%20like%20to%20find%20out%20more."
  class="whatsapp-button"
  target="_blank"
  rel="noopener noreferrer"
>
  Chat on WhatsApp
</a>

  <!-- FOOTER -->
  <div id="siteFooter"></div>

  <!-- JS -->
  <script type="module" src="../js/navigation.js"></script>
  <script src="../js/components-loader.js"></script>

  <script>

    const investors = {

      1: {
        name: "Future Sports Capital",
        role: "Athlete Development Fund",
        location: "United Kingdom",
        image: "../assets/images/investor1.jpg",
        investments: "£5M+",
        athletesSupported: "300+",
        regions: "12+",
        bio: "Future Sports Capital supports emerging athletes and grassroots programmes through strategic investment and long term development funding.",
        specialties: [
          "Youth Athlete Funding",
          "Grassroots Development",
          "Elite Performance Investment"
        ]
      },

      2: {
        name: "Elite Pathways Group",
        role: "Scholarship & Sponsorship",
        location: "Europe & USA",
        image: "../assets/images/investor2.jpg",
        investments: "£8M+",
        athletesSupported: "500+",
        regions: "20+",
        bio: "Elite Pathways Group provides sponsorship opportunities, scholarship support and athlete career progression programmes.",
        specialties: [
          "Scholarships",
          "International Sponsorship",
          "Athlete Career Development"
        ]
      },

      3: {
        name: "Global Sports Ventures",
        role: "Performance Investment",
        location: "International",
        image: "../assets/images/investor3.jpg",
        investments: "£12M+",
        athletesSupported: "750+",
        regions: "30+",
        bio: "Global Sports Ventures partners with athletes, academies and sports organisations to create sustainable high performance pathways.",
        specialties: [
          "High Performance Funding",
          "Academy Partnerships",
          "Global Athlete Investment"
        ]
      }

    };

    const params = new URLSearchParams(window.location.search);
    const id = params.get("id") || 1;

    const investor = investors[id];

    document.getElementById("profileName").textContent = investor.name;
    document.getElementById("profileRole").textContent = investor.role;
    document.getElementById("profileLocation").textContent = investor.location;

    document.getElementById("profileImage").src = investor.image;

    document.getElementById("investments").textContent = investor.investments;
    document.getElementById("athletesSupported").textContent = investor.athletesSupported;
    document.getElementById("regions").textContent = investor.regions;

    document.getElementById("bio").textContent = investor.bio;

    const specialtiesList = document.getElementById("specialties");

    investor.specialties.forEach(item => {

      const li = document.createElement("li");

      li.textContent = item;

      specialtiesList.appendChild(li);

    });

  </script>

<script src="../js/components-loader.js"></script>

</body>
</html>
